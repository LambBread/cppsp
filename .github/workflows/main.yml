name: Create and Run cppsp Script

on:
  push:
    branches: [ "first" ]
  workflow_dispatch:
    inputs:
      file_path:
        description: ' .cppsp file path（like: scripts/script.cppsp）'
        required: true
        default: 'script.cppsp'
      file_content:
        description: 'file content（full .cppsp code）'
        required: true
        type: string

permissions:
  contents: write  # 允許 workflow 寫入 repository

jobs:
  create-and-run:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: first  # 確保 checkout 到 first 分支

      - name: Create cppsp file from input
        run: |
          $dir = Split-Path "${{ inputs.file_path }}" -Parent
          if ($dir) { New-Item -ItemType Directory -Force -Path $dir }
          "${{ inputs.file_content }}" | Out-File -Encoding utf8 "${{ inputs.file_path }}"
        shell: pwsh

      - name: Commit and push new file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.file_path }}"
          git commit -m "Add/Update cppsp file: ${{ inputs.file_path }} (via workflow_dispatch)"
          git push origin first
        shell: pwsh

      - name: Check C++ Compiler
        run: g++ --version

      - name: Download cppsp_compiler.exe
        shell: pwsh
        run: |
          # 改用 raw URL 下載 binary（避免下載整個 blob 頁面）
          Invoke-WebRequest -Uri "https://github.com/user19870/cppsp/raw/First/cppsp_compiler.exe" -OutFile "cppsp_compiler.exe"

      - name: Run cppsp Script
        shell: pwsh
        run: |
          .\cppsp_compiler.exe "${{ inputs.file_path }}"
